<!DOCTYPE html>
<html>
    <head>
        <title>Sohbet</title>
        <style>
            #logo {
                display: block;
                position: fixed;
                bottom: 15px;
                right: 15px;
                margin: 0;
                width: 200px;
}
             #bayrak {
                display: block;
                position: fixed;
                top: 15px;
                right: 15px;
                margin: 0;
                width: 150px;
                z-index: 10; }

            #solpanel {
                position: fixed;
                top: 0;
                left: 0;
                width: 300px;
                height: 100%;
                background-color: rgb(25, 25, 25);
                padding: 20px;
                box-sizing: border-box;
                font-weight: bold;
                font-size: 24px;
                text-align: center;
                
              
            }

            #yenisohbet {
                background-color: rgb(48, 48, 48);
                color: rgb(236, 236, 236);
                border: none;
                border-radius: 12px;
                width: 100%;
                padding: 14px;
                font-size: 16px;
                font-family:Georgia, 'Times New Roman', Times, serif;
                font-weight: bold;
                display: block;
                margin: 0 auto;
            }

            body{
                
                background-color: rgb(33, 33, 33);
                color: rgb(236, 236, 236);
                font-family:Georgia, 'Times New Roman', Times, serif;
                max-width: 800px;
                margin: 0 auto;
                
            }
                #sohbetkutusu{
                    width: 80%;
                    padding: 15px 20px;
                    color:rgb	rgb(236, 236, 236);
                    background-color: rgb(236, 236, 236);
                    border: 1px solid rgb(236, 236, 236);
                    border-radius: 25px;
                    font-size: 18px;
                    font-weight: bold;
                }
                #gonderbutonu{
                    background-color: rgb(236, 236, 236);
                    color: rgb(33, 33, 33);
                    padding: 15px 22px;
                    font-size: 18px;
                    border: none;
                    border-radius: 25px;
                    cursor: pointer;
                    position: relative;
                    top: 15px;
                    font-weight: bold;
                    
                    
                }
                #sohbetalani {
                    width: 100%;
                    height: 500px;
                    border: 1px solid gray;
                    padding: 10px;
                    overflow-y: auto;
                    box-sizing: border-box;
                    font-weight: bold;

                } 
                
                .kullanici {
                     background-color: white;
                     color:rgb(33, 33, 33);
                     border-radius: 18px;
                    padding: 16px 24px;
                    margin: 5px 0 5px auto;
                    width: fit-content;
                    max-width: 70%;
                    
                }

                .bot {
                    background-color: transparent;
                    padding: 8px 12px;
                    margin: 5px auto 5px 0;
                    border-radius: 12px;
                    width: fit-content;
                    max-width: 100%;
                    
                }
                
                
                h1 {
                text-align: center;
                color: gray;
                font-weight: bold;
                 }

                 h2 {
                text-align: center;
                color: gray;
                
                 }
                
                 #sohbetalani{
                background-color: transparent;
                border-radius: 12px;
                width: 100%;
                height: 70vh;
                border: none;
                background-color: transparent;
                font-weight: bold;
                }

                #yazialani {
                    text-align: center;
                    margin-top: 30px;
                    font-weight: bold;
                }

                #eskiler {
                    margin-top: 20px;
                }

                .eskisatir {
                    font-size: 16px;
                    text-align: left;
                    padding: 10px 12px;
                    border-radius: 8px;
                    font-weight: bold;
                    background-color: rgb(40, 40, 40);
                    margin-bottom: 8px;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }

                .eskibaslik {
                    font-size: 16px;
                    text-align: left;
                    padding: 10px 12px;
                }


               
        </style>
    
    </head>

    <body>
            <img id="logo" src="/logo.png" alt="SSTEK logosu">
            <img id="bayrak" src="/bayrak.gif" alt="TurkBayragi">
            <h1>SSTEK AI</h1>
            <h2>Savunma Sanayi Teknolojileri AŞ</h2>

            <div id="solpanel">
            <h3>Sohbet</h3>
            <button id="yenisohbet">Yeni sohbet</button>
            <div id="eskiler">
            <div class="eskibaslik">Son Kullanılanlar ⌄ </div>
            </div>
             </div>

            <div id="sohbetalani"></div>

            <div id="yazialani">
            <input type="text" id="sohbetkutusu" placeholder="Bir mesaj yazın...">
            <button id="gonderbutonu">GÖNDER</button>
            </div>

           
            
            
             
            <script>
                console.log("sohbet hazir");

                const gonderbutonu = document.getElementById("gonderbutonu");
                console.log(gonderbutonu);

                const yenisohbet = document.getElementById("yenisohbet");
                console.log(yenisohbet);

                const sohbetkutusu = document.getElementById("sohbetkutusu");
                console.log(sohbetkutusu);

                const sohbetalani = document.getElementById("sohbetalani");
                console.log(sohbetalani);

                let sohbetilk = "";

                const eskiler = document.getElementById("eskiler");

                gonderbutonu.addEventListener("click", 
                    async function() {
                        const mesaj = sohbetkutusu.value;

                        if (sohbetilk === "") {
                               sohbetilk = mesaj;
                            }
                            console.log(sohbetilk);

                        const kullanicisatiri = document.createElement("div");
                        kullanicisatiri.textContent = mesaj;
                        kullanicisatiri.className = "kullanici";
                        sohbetalani.appendChild(kullanicisatiri);
                        sohbetalani.scrollTop = sohbetalani.scrollHeight;

                        sohbetkutusu.value = "";

                        const bekleme = document.createElement("div");
                        bekleme.textContent = "SSTEK AI düşünüyor...";
                        bekleme.className = "bot";
                        sohbetalani.appendChild(bekleme);

                        const sunucucevabi = await fetch("/chat", {
                                method: "POST",
                                headers: {"Content-Type": "application/json"},
                                body: JSON.stringify({mesaj:mesaj})
                                    });

                        const hamcevap = await sunucucevabi.json();
                        bekleme.remove();
                        console.log(hamcevap);

                        const botsatiri=document.createElement("div");
                        botsatiri.textContent = hamcevap.cevap;

                        botsatiri.className = "bot";
                        sohbetalani.appendChild(botsatiri);
                        sohbetalani.scrollTop = sohbetalani.scrollHeight;
                    });

                    sohbetkutusu.addEventListener("keydown", function(gonder) {
                        if (gonder.key === "Enter") {
                             gonderbutonu.click();
    }
});

                    yenisohbet.addEventListener("click", async function() {
                    await fetch("/sifirla", {method: "POST"});
                    if (sohbetilk !== "") {
                        const sohbetsatir = document.createElement("div");
                        sohbetsatir.textContent = sohbetilk;
                        sohbetsatir.className = "eskisatir";
                        eskiler.appendChild(sohbetsatir);
                            }
                            sohbetilk = "";
                    sohbetalani.innerHTML = "";
});
                
            </script>

    </body>

</html>
